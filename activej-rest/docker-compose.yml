version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: activej-postgres
    environment:
      POSTGRES_DB: projectdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: activej-rest-app
    ports:
      - "8087:8087"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: projectdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8087
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
