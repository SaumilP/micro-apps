services:
  # MySQL Database
  mysql:
    image: mysql:8.0-debian
    container_name: vertx-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: planner
      MYSQL_USER: vertx
      MYSQL_PASSWORD: vertx123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vertx-network

  # Vert.x Application
  vertx-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertx-lite-app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: planner
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - vertx-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  vertx-network:
    driver: bridge
