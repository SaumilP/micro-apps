services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: light4j-postgres
    environment:
      POSTGRES_DB: microservices
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - light4j-network

  # Light4J REST Application
  light4j-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: light4j-rest-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/microservices
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - light4j-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  light4j-network:
    driver: bridge
