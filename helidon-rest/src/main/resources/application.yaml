server:
  port: 8084
  host: 0.0.0.0

db:
  source: jdbc
  connection:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:projectdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    poolName: "hikari"
  statements:
    select-all: "SELECT id, user_id, name, description FROM project"
    select-by-id: "SELECT id, user_id, name, description FROM project WHERE id = ?"
    select-by-user-id: "SELECT id, user_id, name, description FROM project WHERE user_id = ?"
    insert-project: "INSERT INTO project (user_id, name, description) VALUES (?, ?, ?)"
    delete-by-id: "DELETE FROM project WHERE id = ?"
