apiVersion: v1
kind: ConfigMap
metadata:
  name: undertow-config
  labels:
    app: undertow-baseline
data:
  # Application configuration
  log-level: "INFO"

  # Undertow server configuration
  server.properties: |
    # Server settings optimized for performance
    server.port=8088
    server.host=0.0.0.0

    # Worker threads (2x CPU cores recommended)
    io.threads=8
    worker.threads=200

    # Connection settings
    max.connections=10000
    connection.timeout=30000

    # Buffer sizes (tuned for high throughput)
    buffer.size=16384
    direct.buffers=true

  # HikariCP database connection pool
  datasource.properties: |
    # Connection pool sized for performance
    hikari.maximumPoolSize=20
    hikari.minimumIdle=5
    hikari.connectionTimeout=30000
    hikari.idleTimeout=600000
    hikari.maxLifetime=1800000
    hikari.leakDetectionThreshold=60000

    # PostgreSQL optimizations
    hikari.dataSource.cachePrepStmts=true
    hikari.dataSource.prepStmtCacheSize=250
    hikari.dataSource.prepStmtCacheSqlLimit=2048
    hikari.dataSource.useServerPrepStmts=true

  # JVM configuration
  jvm-options: |
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=100
    -XX:+ParallelRefProcEnabled
    -XX:+UnlockExperimentalVMOptions
    -XX:+UseCGroupMemoryLimitForHeap
    -XX:+PrintGCDetails
    -XX:+PrintGCDateStamps
    -Xlog:gc*:file=/app/logs/gc.log:time,uptime:filecount=5,filesize=10M
